x-fortress-env: &fortress-env
  PYTHONPATH: /app
  DATABASE_URL: postgresql://${POSTGRES_USER:-mlsecops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mlsecops}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-changeme}
  AWS_DEFAULT_REGION: us-east-1
  POSTGRES_USER: ${POSTGRES_USER:-mlsecops}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  POSTGRES_DB: ${POSTGRES_DB:-mlsecops}
  FORTRESS_ATTESTATION_PATH: /app/artifacts/attestation/fortress-attestation.signed.json
  FORTRESS_PYTHON_GATES: "true"
  KEYCLOAK_URL: http://keycloak:8080
  API_SCORING_URL: http://api-scoring:8001
  API_ANTIFRAUD_URL: http://api-antifraud:8002
  LITELLM_URL: http://litellm:4000

services:
  fortress:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.fortress
    image: ${DOCKERHUB_USER:-rinakt}/mlsecops-fortress:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
    environment:
      <<: *fortress-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks:
      - default

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlsecops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-mlsecops}
    ports:
      - "5432:5432"
    volumes:
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlsecops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minio} $${MINIO_ROOT_PASSWORD:-changeme};
      mc mb -p local/mlflow || true;
      mc mb -p local/datasets || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}

  keycloak:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.keycloak
    image: ${DOCKERHUB_USER:-rinakt}/mlsecops-keycloak:${IMAGE_TAG:-latest}
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mlsecops}
      KC_DB_USERNAME: ${POSTGRES_USER:-mlsecops}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./infra/docker/keycloak-healthcheck.sh:/opt/keycloak-healthcheck.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash /opt/keycloak-healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 25
      start_period: 120s

  mlflow:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.mlflow
    image: ${DOCKERHUB_USER:-rinakt}/mlsecops-mlflow:${IMAGE_TAG:-latest}
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-mlsecops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mlsecops}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow/
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-changeme}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  keycloak-bootstrap:
    image: ${DOCKERHUB_USER:-rinakt}/mlsecops-dashboard:${IMAGE_TAG:-latest}
    entrypoint: ["python", "-c"]
    command:
      - |
        import sys
        sys.path.insert(0, "/app")
        from fortress.keycloak_bootstrap import ensure_keycloak_clients
        ok, msg = ensure_keycloak_clients()
        print(msg)
        sys.exit(0 if ok else 1)
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: mlsecops
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      MLFLOW_OAUTH_SECRET: ${MLFLOW_OAUTH_SECRET:-mlflow-oauth-dev-secret}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8502}
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "on-failure"

  oauth2-proxy-mlflow:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    command:
      - --provider=oidc
      - --oidc-issuer-url=http://keycloak:8080/realms/mlsecops
      - --insecure-oidc-skip-issuer-verification=true
      - --client-id=mlflow-oauth
      - --client-secret=${MLFLOW_OAUTH_SECRET:-mlflow-oauth-dev-secret}
      - --redirect-url=http://localhost:5000/oauth2/callback
      - --upstream=http://mlflow:5000/
      - --http-address=0.0.0.0:4180
      - --email-domain=*
      - --cookie-secure=false
      - --cookie-samesite=lax
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET:-YXNkZmFzZGZhc2RmYXNkZmFzZGZhc2Rm}
      - --skip-provider-button=true
      - --code-challenge-method=S256
      - --pass-user-headers=true
      - --set-xauthrequest=true
      - --scope=openid email profile groups
      - --oidc-groups-claim=groups
      - --allowed-group=ds
      - --allowed-group=mlsecops
    ports:
      - "5000:4180"
    depends_on:
      keycloak-bootstrap:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy

  api-scoring:
    build:
      context: .
      dockerfile: services/api_scoring/Dockerfile
    image: ${DOCKERHUB_USER:-rinakt}/mlsecops-api-scoring:${IMAGE_TAG:-latest}
    ports:
      - "8001:8001"
    volumes:
      - ./models/m1_scoring/artifact:/app/models/m1_scoring/artifact:ro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlsecops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mlsecops}
      MODEL_NAME: credit-scoring-pd
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api-antifraud:
    build:
      context: .
      dockerfile: services/api_antifraud/Dockerfile
    image: ${DOCKERHUB_USER:-rinakt}/mlsecops-api-antifraud:${IMAGE_TAG:-latest}
    ports:
      - "8002:8002"
    volumes:
      - ./artifacts/models/m2_antifraud:/app/artifacts/models/m2_antifraud:ro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlsecops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mlsecops}
      MODEL_NAME: transaction-antifraud
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

  litellm:
    build:
      context: .
      dockerfile: services/litellm/Dockerfile
    image: ${DOCKERHUB_USER:-rinakt}/mlsecops-litellm:${IMAGE_TAG:-latest}
    ports:
      - "4000:4000"
    volumes:
      - ./models/m3_nlp/artifact:/app/models/m3_nlp/artifact:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlsecops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mlsecops}
      LLM_GUARD_ENABLED: ${LLM_GUARD_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      M3_MODEL_PATH: /app/models/m3_nlp/artifact/intent_pipeline.joblib
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: ${DOCKERHUB_USER:-rinakt}/mlsecops-dashboard:${IMAGE_TAG:-latest}
    ports:
      - "${DASHBOARD_PORT:-8502}:8501"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_PUBLIC_URI: http://localhost:5000
      JUPYTER_PUBLIC_URI: http://localhost:8888
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-changeme}
      AWS_DEFAULT_REGION: us-east-1
      FORTRESS_PYTHON_GATES: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: mlsecops
      KEYCLOAK_CLIENT_ID: fortress-ui
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlsecops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mlsecops}
      FORTRESS_ATTESTATION_PATH: /app/artifacts/attestation/fortress-attestation.signed.json
      MLFLOW_HEALTH_URL: http://mlflow:5000
      JUPYTER_HEALTH_URL: http://jupyter:8888
      FORTRESS_STRICT_AUDIT: "true"
    volumes:
      - .:/app
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully

  jupyter:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.jupyter
    image: ${DOCKERHUB_USER:-rinakt}/mlsecops-jupyter:${IMAGE_TAG:-latest}
    ports:
      - "8888:8888"
    environment:
      <<: *fortress-env
      MLFLOW_PUBLIC_URI: http://localhost:5000
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-fortress}
    volumes:
      - .:/home/jovyan/work
      - ${DS_DATA_HOST_PATH:-./}:/home/jovyan/host-data:ro
    depends_on:
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  minio_data:
