name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: MLflow registered model name
        required: true
        default: credit-scoring-pd
      model_version:
        description: Model version
        required: true
        default: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt cryptography mlflow
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fortress-attestation
          path: artifacts/attestation/
      - run: |
          export DEPLOY_MODEL="${{ inputs.model_name }}"
          export DEPLOY_VERSION="${{ inputs.model_version }}"
          export FORTRESS_ATTESTATION_PATH=artifacts/attestation/fortress-attestation.signed.json
          python scripts/ci/deploy_precheck.py
      - run: |
          ACTOR_ROLE=mlsecops python -c "
          import sys; sys.path.insert(0, '.')
          from fortress.deploy_runner import deploy_to_production
          ok, msg = deploy_to_production('${{ inputs.model_name }}', '${{ inputs.model_version }}', 'mlsecops1', approve=True)
          print(msg)
          sys.exit(0 if ok else 1)
          "
        env:
          FORTRESS_ATTESTATION_PATH: artifacts/attestation/fortress-attestation.signed.json
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
