name: CI Pipeline (MLflow path)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      model_key:
        description: m1 | m2 | m3 | all
        default: m1

env:
  RUN_ID: ${{ github.run_id }}
  CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  POSTGRES_USER: mlsecops
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: mlsecops
  MINIO_ROOT_USER: minio
  MINIO_ROOT_PASSWORD: changeme
  MLFLOW_OAUTH_SECRET: mlflow-oauth-dev-secret
  OAUTH2_PROXY_COOKIE_SECRET: YXNkZmFzZGZhc2RmYXNkZmFzZGZhc2Rm
  IMAGE_TAG: ci
  # Prod-like stack (S3 + MLflow + APIs + Streamlit UI + Jupyter)
  COMPOSE_STACK: >-
    postgres minio minio-init keycloak keycloak-bootstrap mlflow
    oauth2-proxy-mlflow api-scoring api-antifraud litellm dashboard jupyter
  COMPOSE_BUILD: >-
    keycloak mlflow dashboard jupyter api-scoring api-antifraud litellm fortress

jobs:
  gate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build fortress
      - name: DATA gate (fortress container)
        run: |
          docker compose --profile tools run --rm --no-deps \
            -e RUN_ID="${{ env.RUN_ID }}" \
            -e CORRELATION_ID="${{ env.CORRELATION_ID }}" \
            fortress ci-gate-data
      - uses: actions/upload-artifact@v4
        with:
          name: fortress-artifacts
          path: artifacts/

  gate-code:
    needs: gate-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: actions/download-artifact@v4
        with:
          name: fortress-artifacts
          path: artifacts
      - run: docker compose build fortress
      - name: Code gates G0–G3b (fortress container)
        run: |
          docker compose --profile tools run --rm --no-deps \
            -e RUN_ID="${{ env.RUN_ID }}" \
            -e CORRELATION_ID="${{ env.CORRELATION_ID }}" \
            -e AUDIT_DISABLED=true \
            fortress ci-gate-code
      - uses: actions/upload-artifact@v4
        with:
          name: fortress-artifacts
          path: artifacts/

  train:
    needs: gate-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: actions/download-artifact@v4
        with:
          name: fortress-artifacts
          path: artifacts
      - run: docker compose build ${{ env.COMPOSE_BUILD }}
      - name: Start prod-like stack (Postgres + MinIO/S3 + MLflow + UI)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --wait --wait-timeout 600 ${{ env.COMPOSE_STACK }}
      - name: Bootstrap MLflow experiments
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile tools run --rm \
            -e RUN_ID="${{ env.RUN_ID }}" \
            -e CORRELATION_ID="${{ env.CORRELATION_ID }}" \
            fortress bootstrap
      - name: Verify dashboard UI is up
        run: |
          curl -sf http://localhost:8502/_stcore/health
          echo "Dashboard OK (http://localhost:8502)"
      - name: Train M1/M2/M3 (fortress container)
        run: |
          docker compose --profile tools run --rm \
            -e RUN_ID="${{ env.RUN_ID }}" \
            -e CORRELATION_ID="${{ env.CORRELATION_ID }}" \
            fortress train
      - uses: actions/upload-artifact@v4
        with:
          name: fortress-artifacts
          path: |
            artifacts/
            models/m1_scoring/artifact/
            artifacts/models/m2_antifraud/
            models/m3_nlp/artifact/
      - name: Teardown stack
        if: always()
        run: docker compose down -v

  gate-artifacts:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: actions/download-artifact@v4
        with:
          name: fortress-artifacts
          path: .
      - run: docker compose build ${{ env.COMPOSE_BUILD }}
      - name: Start stack for artifact gates
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --wait --wait-timeout 300 postgres minio minio-init mlflow
      - name: G6/G7 artifact gates (fortress container)
        run: |
          docker compose --profile tools run --rm \
            -e RUN_ID="${{ env.RUN_ID }}" \
            -e CORRELATION_ID="${{ env.CORRELATION_ID }}" \
            fortress ci-gate-artifacts
      - name: G11 Trivy container scan (CRITICAL CVE)
        run: |
          chmod +x gates/g11_trivy.sh
          IMAGE_TAG=${{ env.IMAGE_TAG }} DOCKERHUB_USER=rinakt bash gates/g11_trivy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fortress-artifacts
          path: |
            artifacts/
            models/m1_scoring/artifact/
            artifacts/models/m2_antifraud/
            models/m3_nlp/artifact/
      - name: Teardown stack
        if: always()
        run: docker compose down -v

  gate-model:
    needs: gate-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: actions/download-artifact@v4
        with:
          name: fortress-artifacts
          path: .
      - run: docker compose build ${{ env.COMPOSE_BUILD }}
      - name: Start full stack (G10 needs LiteLLM)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --wait --wait-timeout 600 ${{ env.COMPOSE_STACK }}
      - name: G5/G8/G9/G10 model gates (fortress container)
        run: |
          docker compose --profile tools run --rm \
            -e RUN_ID="${{ env.RUN_ID }}" \
            -e CORRELATION_ID="${{ env.CORRELATION_ID }}" \
            fortress ci-gate-model
      - uses: actions/upload-artifact@v4
        with:
          name: fortress-artifacts
          path: |
            artifacts/
            models/m1_scoring/artifact/
            artifacts/models/m2_antifraud/
            models/m3_nlp/artifact/
            artifacts/monitoring/
            artifacts/signing/
      - name: Teardown stack
        if: always()
        run: docker compose down -v

  sign-attestation:
    needs: gate-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: actions/download-artifact@v4
        with:
          name: fortress-artifacts
          path: .
      - run: docker compose build fortress
      - name: Sign attestation (Ed25519 strict)
        run: |
          docker compose --profile tools run --rm --no-deps \
            -e RUN_ID="${{ env.RUN_ID }}" \
            -e CORRELATION_ID="${{ env.CORRELATION_ID }}" \
            fortress ci-sign
      - uses: actions/upload-artifact@v4
        with:
          name: fortress-attestation
          path: artifacts/attestation/

  unit-tests:
    needs: sign-attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fortress-attestation
          path: artifacts/attestation/
      - run: docker compose build fortress
      - name: Pytest (fortress container)
        run: |
          docker compose --profile tools run --rm --no-deps fortress test
          docker compose --profile tools run --rm --no-deps fortress \
            test tests/test_pii_scanner.py tests/test_g15_drift.py tests/test_deps_policy.py -q
