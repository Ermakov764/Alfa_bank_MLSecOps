name: CI Pipeline (MLflow path)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      model_key:
        description: m1 | m2 | m3 | all
        default: m1

env:
  RUN_ID: ${{ github.run_id }}
  CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  # Fast, deterministic defaults for CI environment
  POSTGRES_USER: mlsecops
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: mlsecops
  MINIO_ROOT_USER: minio
  MINIO_ROOT_PASSWORD: changeme
  MLFLOW_OAUTH_SECRET: mlflow-oauth-dev-secret
  OAUTH2_PROXY_COOKIE_SECRET: YXNkZmFzZGZhc2RmYXNkZmFzZGZhc2Rm
  IMAGE_TAG: ci

jobs:
  compose-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env for compose
        run: |
          cp .env.example .env
          # CI overrides come from workflow env section above.
      - name: Build images (cache-friendly)
        run: |
          docker compose build mlflow api-scoring api-antifraud litellm dashboard fortress
      - name: Start prod-like stack (S3 + MLflow + UI)
        run: |
          docker compose up -d postgres minio minio-init keycloak mlflow oauth2-proxy-mlflow api-scoring api-antifraud litellm dashboard
      - name: Run CI pipeline inside fortress container
        run: |
          docker compose --profile tools run --rm \
            -e RUN_ID="${{ env.RUN_ID }}" \
            -e CORRELATION_ID="${{ env.CORRELATION_ID }}" \
            fortress pipeline
      - name: Run unit tests inside fortress container
        run: |
          docker compose --profile tools run --rm fortress test
      - name: Upload artifacts (gates + attestation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortress-artifacts
          path: artifacts/
      - name: Dump compose status
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 mlflow oauth2-proxy-mlflow dashboard litellm || true
      - name: Teardown
        if: always()
        run: docker compose down -v
