# Legacy smoke: fast G5 check only. Full pipeline — ci-pipeline.yml.
# Runs in parallel on every push; disable here or add paths-ignore if noisy.
name: Security Gates (legacy smoke)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  redirect-note:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Full pipeline — see ci-pipeline.yml (sequential gates + train + sign)"

  g5-evil-pickle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/fixtures/malicious/create_evil_pickle.py
      - name: G5 evil model must fail
        run: |
          chmod +x gates/modelaudit.sh
          bash gates/modelaudit.sh tests/fixtures/malicious/evil_model.pkl && exit 1 || echo "G5 correctly failed"
